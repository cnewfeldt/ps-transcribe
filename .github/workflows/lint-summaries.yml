name: Lint Summaries

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*-SUMMARY.md'
      - '**/*-PLAN.md'
      - 'scripts/lint-summaries.sh'
      - '.github/workflows/lint-summaries.yml'

jobs:
  lint-summaries:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install yq
        run: |
          brew install yq
          yq --version

      - name: Lint SUMMARY frontmatter
        run: bash scripts/lint-summaries.sh
